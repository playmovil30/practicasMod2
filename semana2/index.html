<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://framework-gb.cdn.gob.mx/snd/v1.1.0/snd-guinda.css" rel="stylesheet">
</head>

<body>
    <header class="header">
        <a class="irContent" href="#mainContent">
            Ir al contenido principal
        </a>
        <section class="mexico">
            <div class="mexico__contenedor">
                <div class="mexico__escudo">
                    <a href="https://www.gob.mx/" class="mexico__aescudo"
                        aria-label="Ir a la pagina de inicio del Gobierno de Mexico">
                        <img src="https://framework-gb.cdn.gob.mx/gobmx/img/logo_blanco.svg" class="adty-desk"
                            alt="Logo GOB MX" style="max-width: 150px;">
                    </a>
                </div>
                <div class="mexico__menu">
                    <details class="mexico__details" open="">
                        <summary class="mexico__summary">
                            <span class="mexico__span">
                                Menu
                            </span>
                        </summary>
                        <div class="mexico__detailsCont">
                            <a href="https://www.gob.mx/tramites" class="mexico__a">
                                Tramites
                            </a>
                            <a href="https://www.gob.mx/gobierno" class="mexico__a">
                                Gobierno
                            </a>
                        </div>
                    </details>
                </div>
            </div>
        </section>
    </header>
   <section class="subheader" style="margin-top: 70px;">
        <div class="subheader__contenedor">
            <details class="mexico__details navHeader__details">
                <summary class="mexico__summary">
                    <span class="mexico__span">
                        Menú
                      </span>
                </summary>
                <nav class="navHeader">
                    <ul class="navHeader__ul mexico__detailsCont">
                        <li class="navHeader__li">
                            <a href="#" aria-current="page" class="navHeader__a">
                                Inicio
                              </a>
                        </li>
                    </ul>
                </nav>
            </details>
        </div>
    </section>




    <script src="https://framework-gb.cdn.gob.mx/snd/v1.1.0/snd.js" async defer></script>
</body>

</html>
